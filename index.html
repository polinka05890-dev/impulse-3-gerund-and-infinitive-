<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impulse 3 · Gerunds and infinitives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEAE2;--card:#FBF8F3;--ink:#2F3440;--soft:#6B707D;--line:#DDD4C6;--pink:#A4545F;--mint:#4F7A64;--sun:#E6D9C2;--ok:#DCE8DD;--bad:#F1DEDC;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2227;--card:#292D34;--ink:#EEEAE2;--soft:#A9ADB8;--line:#43474F;--pink:#DDA0A9;--mint:#9BC2A8;--sun:#4A4538;--onacc:#1F2227;--ok:#26382E;--bad:#40292C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2227;--card:#292D34;--ink:#EEEAE2;--soft:#A9ADB8;--line:#43474F;--pink:#DDA0A9;--mint:#9BC2A8;--sun:#4A4538;--onacc:#1F2227;--ok:#26382E;--bad:#40292C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Outfit,system-ui,sans-serif;min-height:100%}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 70px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
h1{font:800 clamp(30px,5vw,46px)/1 Fraunces,Georgia,serif;margin:16px 0 0;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:600;color:var(--pink)}
.sub{color:var(--soft);margin:10px 0 0;max-width:46ch}
.total{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 20px;text-align:center;min-width:120px}
.total b{display:block;font:800 32px Fraunces,serif;line-height:1.1}
.total span{font-size:14px;opacity:.8}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
nav button{font:500 15px Outfit,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 16px 6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.dg{height:30px;width:auto}
nav button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.logo{display:flex;align-items:flex-end;gap:3px}.logo img{height:clamp(44px,8vw,68px);width:auto}.logo .three{margin-left:14px}
.stk{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 10px rgba(37,42,61,.18))}
.hd{display:flex;align-items:flex-end;gap:16px}.hero{height:118px;width:auto;transform:rotate(-5deg)}
.side{float:right;height:110px;width:auto;margin:0 0 8px 14px;transform:rotate(4deg)}
.mood{height:56px;width:auto;vertical-align:middle;margin-right:8px}
.score{display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{background:var(--bg);border-radius:8px;padding:1px 10px;font-size:14.5px}
.tl{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:18px}.tl>div{background:var(--bg);border-radius:14px;padding:12px 16px;font-size:16px}.tl small{display:block;color:var(--soft);font-size:14px}.tl .now{background:var(--ink);color:var(--bg);font-weight:600;border-radius:999px;padding:8px 16px}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:18px}
.rc{border:2px solid var(--line);border-radius:18px;padding:16px 18px 12px;position:relative;background:var(--card)}.rc p{margin:4px 0}
.tag{position:absolute;top:-12px;right:14px;background:var(--sun);color:var(--ink);font:600 13.5px Outfit;padding:2px 12px;border-radius:8px;transform:rotate(3deg)}
.fm{font:600 18px Fraunces,serif}.fm u{text-decoration:none;color:var(--pink);border-bottom:3px solid var(--pink)}.ex{font-size:17px}.nt{color:var(--soft);font-size:14.5px}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:15px}.lists h3{font:700 18px Fraunces,serif;margin:0 0 4px}.lists p{margin:0;color:var(--soft)}
@media(max-width:560px){.tl{grid-template-columns:1fr}}
footer{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--soft);font-size:15px;margin-top:22px}footer img{height:64px;width:auto;transform:rotate(-6deg)}
nav button.done{border-color:var(--mint)}
nav small{margin-left:6px;opacity:.85}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:28px clamp(18px,4vw,40px)}
h2{font:800 30px Fraunces,serif;margin:0 0 4px}
.intro{color:var(--soft);margin:0 0 22px}
ol{list-style:none;padding:0;margin:0;counter-reset:q}
.it{counter-increment:q;padding:16px 0 16px 44px;border-top:1px dashed var(--line);position:relative}
.it::before{content:counter(q);position:absolute;left:0;top:16px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--ink);font:700 15px Outfit;display:grid;place-items:center}
.it p{margin:0 0 10px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink);text-align:center;font-weight:600;color:var(--pink);padding:0 4px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{font:500 16px Outfit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.opts button:hover{border-color:var(--pink)}
.opts button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.t{font:500 17px Outfit;color:var(--ink);background:transparent;border:0;border-bottom:3px solid var(--pink);width:170px;padding:2px 6px;border-radius:4px 4px 0 0}
input.t:focus{outline:none;background:var(--bg)}
mark{background:var(--sun);color:var(--ink);border-radius:5px;padding:0 6px;text-decoration:line-through;text-decoration-color:#B4566B}
.cue{color:var(--soft);font-weight:500}
.it.ok{background:linear-gradient(90deg,var(--ok),transparent 80%)}
.it.bad{background:linear-gradient(90deg,var(--bad),transparent 80%)}
.fb{display:inline-block;font-size:14.5px;margin-top:8px;font-weight:600;padding:2px 12px;border-radius:10px;transform:rotate(-1deg)}.fb:empty{display:none}
.ok .fb{color:var(--mint);background:var(--ok);border:1.5px solid currentColor}.bad .fb{color:var(--pink);background:var(--bad);border:1.5px solid currentColor}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:20px;border-top:2px solid var(--line)}
.btn{font:600 16px Outfit;border:0;border-radius:999px;padding:11px 24px;cursor:pointer;background:var(--pink);color:var(--onacc,#fff)}
.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.score{margin-left:auto;font:800 26px Fraunces,serif}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fc{perspective:700px;background:none;border:0;padding:0;height:130px;cursor:pointer;font-family:Outfit}
.fc i{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .45s;font-style:normal}
.fc{position:relative}
.fc .f{background:var(--bg);border:2px solid var(--line);color:var(--ink)}
.fc .b{background:var(--pink);color:var(--onacc,#fff);transform:rotateY(180deg)}
.fc.flip .f{transform:rotateY(-180deg)}.fc.flip .b{transform:rotateY(0)}
.fc strong{font:800 24px Fraunces,serif}
.fc span{font-size:14px;opacity:.85}
.tip{background:var(--bg);border-radius:16px;padding:14px 18px;margin-bottom:20px;font-size:15.5px}
.tip b{color:var(--pink)}
@media (prefers-reduced-motion:reduce){.fc i{transition:none}}
</style>
</head>

{t:"Rules 1: change of meaning",k:"rule",intro:"Some verbs can take -ing or to + verb, but the meaning changes. Learn the four patterns, then practise.",html:`
<div class="tl"><div><b>-ing</b> looks back<small>something that already happened</small></div><div class="now">now</div><div><b>to + verb</b> looks forward<small>a task, a plan, a purpose</small></div></div>
<div class="rg">
<div class="rc"><span class="tag">memory</span><p class="fm">remember / forget + <u>V-ing</u></p><p class="ex">I’ll never forget <b>scoring</b> my first goal.</p><p class="nt">An experience in the past.</p></div>
<div class="rc"><span class="tag">task</span><p class="fm">remember / forget + <u>to V</u></p><p class="ex">Don’t forget <b>to call</b> me back.</p><p class="nt">Something you need to do in the future.</p></div>
<div class="rc"><span class="tag">ending</span><p class="fm">stop + <u>V-ing</u></p><p class="ex">We stopped <b>meeting</b> as a team.</p><p class="nt">The activity finishes.</p></div>
<div class="rc"><span class="tag">purpose</span><p class="fm">stop + <u>to V</u></p><p class="ex">I stopped <b>to look</b> around.</p><p class="nt">I paused in order to do something else.</p></div>
</div>
<div class="tip"><b>Memory trick:</b> -ing = look <b>back</b>, to = look <b>forward</b>. With <i>stop</i> ask yourself: “Did the action end, or did I pause to start a new one?”</div>
<div class="bar"><button class="btn" data-go="1">Start practice</button></div>`},

{t:"Rules 2a: -ing",k:"rule",intro:"Now page 8.2, step by step. First the gerund: verb + -ing works like a noun.",html:`
<div class="rg">
<div class="rc"><span class="tag">subject</span><p class="fm"><u>V-ing</u> + verb …</p><p class="ex"><b>Breaking</b> a world record is every athlete’s dream.<br><b>Rowing</b> is more challenging than swimming.</p><p class="nt">The -ing form can start the sentence, like a noun.</p></div>
<div class="rc"><span class="tag">after verbs</span><p class="fm">enjoy, avoid, finish … + <u>V-ing</u></p><p class="ex">Keep <b>practising</b> and your results will get better.<br>I can’t stand <b>watching</b> golf.</p>${C("admit, avoid, can’t stand, consider, don’t mind, enjoy, finish, give up, keep (on), miss, practise, spend (time)")}</div>
<div class="rc"><span class="tag">after prepositions</span><p class="fm">about / after / before / in / of / on / without + <u>V-ing</u></p><p class="ex">Do you warm up before <b>going</b> for a run?<br>I’m thinking of <b>buying</b> tickets to the match.</p><p class="nt">After a preposition, always use -ing.</p></div>
</div>
<div class="tip"><b>Quick test:</b> is there a preposition right before the verb? Then it’s -ing. Is the verb the subject? Then it’s -ing too.</div>
<div class="bar"><button class="btn" data-go="5">Practise -ing</button></div>`},

{t:"Rules 2b: to + verb",k:"rule",intro:"Step two: the to-infinitive. It answers “why?” and follows verbs of plans and wishes.",html:`
<div class="rg">
<div class="rc"><span class="tag">purpose</span><p class="fm">(in order) <u>to V</u></p><p class="ex">They trained really hard (in order) <b>to win</b> the game.<br>She did a course (in order) <b>to become</b> a swimming instructor.</p><p class="nt">Why did they do it? Use to or in order to. Negative: in order not to.</p></div>
<div class="rc"><span class="tag">after verbs</span><p class="fm">decide, hope, want … + <u>to V</u></p><p class="ex">Are you learning <b>to drive</b>?<br>She can’t afford <b>to buy</b> a good tennis racket.</p><p class="nt">Verbs of plans, intentions, decisions and wishes.</p>${C("afford, agree, choose, decide, deserve, expect, forget, help, hope, intend, learn, need, offer, plan, pretend, promise, refuse, remember, seem, start, try, want, would like")}</div>
<div class="rc"><span class="tag">after adjectives</span><p class="fm">surprised, … + <u>to V</u></p><p class="ex">I was surprised <b>to learn</b> that he had come second in the race.</p><p class="nt">Often used with feelings and reactions.</p></div>
</div>
<div class="tip"><b>Compare:</b> <i>I went to the shop to buy milk</i> (purpose) and <i>I enjoy going to the shop</i> (enjoy + -ing). The first verb decides.</div>
<div class="bar"><button class="btn" data-go="7">Practise to + verb</button></div>`},

{t:"Rules 2c: both forms",k:"rule",intro:"Step three: verbs that can take both forms, and verbs with a person after them.",html:`
<div class="rg">
<div class="rc"><span class="tag">same meaning</span><p class="fm">begin, continue, start + <u>V-ing</u> or <u>to V</u></p><p class="ex">Charlie’s started <b>to do / doing</b> yoga regularly.</p><p class="nt">Both forms, no change in meaning.</p></div>
<div class="rc"><span class="tag">small change</span><p class="fm">like, love, hate, prefer</p><p class="ex"><u>-ing</u> = feelings: I hate <b>working</b> out in a gym full of people.<br><u>to V</u> = a regular habit: Susan likes <b>to make</b> her bed first thing in the morning.</p></div>
<div class="rc"><span class="tag">person + to</span><p class="fm">advise, encourage, force, help, remind + <u>person</u> + <u>to V</u></p><p class="ex">Our teacher encouraged <b>us to participate</b> in the competition.</p><p class="nt">A person comes between the verb and to.</p></div>
<div class="rc"><span class="tag">big change</span><p class="fm">remember, forget, stop</p><p class="ex">Did you remember <b>to return</b> the books to the library?<br>I don’t remember <b>meeting</b> this man.<br>We stopped <b>to admire</b> the view.<br>Stop <b>singing</b>! I have a really bad headache.</p><p class="nt">-ing = past or ending. to = future or purpose.</p></div>
</div>
<div class="bar"><button class="btn" data-go="9">Practise both forms</button></div>`},

const S=EX.map(()=>({a:[],r:null}));
let cur=0;
const $=s=>document.querySelector(s);
const norm=s=>(s||"").trim().toLowerCase();
function nav(){
$("#nav").innerHTML=EX.map((e,i)=>`<button role="tab" aria-selected="${i==cur}" class="${S[i].r?'done':''}" data-i="${i}">${String(i+1).split('').map(d=>`<img class="dg" src="${IMG['n'+d]}" alt="">`).join('')}${e.t}${S[i].r?`<small>${S[i].r[0]}/${S[i].r[1]}</small>`:''}</button>`).join("");
let s=0,t=0;S.forEach(x=>{if(x.r){s+=x.r[0];t+=x.r[1]}});
$("#tot").textContent=s+"/"+t;
}
function show(){
const e=EX[cur],st=S[cur];nav();
let h=`<h2>${e.t}</h2><p class="intro">${e.intro}</p>`;
if(e.k=="rule"){$("#main").innerHTML=`<img class="stk side" src="${IMG.c_stand}" alt="">`+h+e.html;return}
if(e.k=="flash"){h=`<img class="stk side" src="${IMG.c_stand}" alt="">`+h;
h+=`<div class="tip">Each card gives you a base word and the word class you need. The <b>suffix</b> is on the back.</div><div class="cards">`+e.cards.map(c=>`<button class="fc" aria-label="Flip card ${c[0]}"><i class="f"><strong>${c[0]}</strong><span>make a ${c[1]}</span></i><i class="b"><strong>${c[2]}</strong><span>${c[3]}</span></i></button>`).join("")+`</div>`;
$("#main").innerHTML=h;return}
h+="<ol>"+e.items.map((it,i)=>{
if(e.k=="c"){
const q=it[0].replace("___",'<span class="gap">&nbsp;&nbsp;&nbsp;</span>');
return `<li class="it" data-i="${i}"><p>${q}</p><div class="opts">${it[1].map((o,j)=>`<button data-i="${i}" data-j="${j}" class="${st.a[i]===j?'sel':''}">${o}</button>`).join("")}</div><span class="fb"></span></li>`}
const q=it[0].replace("___",`<input class="t" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${st.a[i]||''}">`);
return `<li class="it" data-i="${i}"><p>${q}</p>${e.k=="e"?`<input class="t" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="correct form" value="${st.a[i]||''}">`:''}<span class="fb"></span></li>`}).join("")+"</ol>";
h+=`<div class="bar"><button class="btn" id="chk">Check answers</button><button class="btn g" id="ans">Show answers</button><button class="btn g" id="rst">Try again</button><span class="score" id="sc"></span></div>`;
$("#main").innerHTML=h;
if(e.k=="e")document.querySelectorAll(".it p+input.t").forEach(()=>{});
if(st.r)mark();
}
function correct(e,i){const it=e.items[i];return e.k=="c"?it[2]:it[1]}
function ok(e,i,v){if(e.k=="c")return v===e.items[i][2];return e.items[i][1].split("|").includes(norm(v))}
function check(){
const e=EX[cur],st=S[cur];let s=0;
document.querySelectorAll(".it input.t").forEach(inp=>{st.a[+inp.dataset.i]=inp.value});
e.items.forEach((_,i)=>{if(ok(e,i,st.a[i]))s++});
st.r=[s,e.items.length];nav();mark();
}
function mark(){
const e=EX[cur],st=S[cur];
document.querySelectorAll(".it").forEach(li=>{
const i=+li.dataset.i,g=ok(e,i,st.a[i]);
li.classList.toggle("ok",g);li.classList.toggle("bad",!g);
const c=e.k=="c"?e.items[i][1][e.items[i][2]]:e.items[i][1].split("|")[0];
li.querySelector(".fb").textContent=g?"Correct!":"Answer: "+c;
});
const pc=st.r[0]/st.r[1],mo=pc==1?"c_fire":pc>=.8?"c_happy":pc>=.5?"c_smile":"c_grump";$("#sc").innerHTML=`<img class="stk mood" src="${IMG[mo]}" alt=""> ${st.r[0]} / ${st.r[1]}`;
}
document.addEventListener("click",ev=>{
const t=ev.target.closest("button");if(!t)return;
if(t.dataset.j!==undefined&&t.closest(".opts")){
const i=+t.dataset.i;if(S[cur].r)return;
S[cur].a[i]=+t.dataset.j;
t.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("sel"));t.classList.add("sel");const e=EX[cur],li=t.closest(".it"),g=ok(e,i,+t.dataset.j);li.classList.toggle("ok",g);li.classList.toggle("bad",!g);li.querySelector(".fb").textContent=g?"Spot on!":"Not quite. Try the other one.";return}
if(t.dataset.go){cur=+t.dataset.go;show();scrollTo(0,0);return}
if(t.closest("#nav")){cur=+t.dataset.i;show();return}
if(t.classList.contains("fc")){t.classList.toggle("flip");return}
if(t.id=="chk")check();
if(t.id=="rst"){S[cur]={a:[],r:null};show()}
if(t.id=="ans"){
const e=EX[cur];
S[cur].a=e.items.map((it,i)=>e.k=="c"?it[2]:it[1].split("|")[0]);
S[cur].r=[e.items.length,e.items.length];show();
document.querySelectorAll(".it").forEach(li=>li.querySelector(".fb").textContent="");
$("#sc").textContent="answers shown";
S[cur].r=null;nav();
}
});
document.addEventListener("keydown",ev=>{if(ev.key=="Enter"&&ev.target.classList.contains("t")){const n=ev.target.closest(".it").nextElementSibling;const nx=n&&n.querySelector("input.t");if(nx)nx.focus();else check()}});
$("#logo").innerHTML=["LI","LM","LP","LU","LL","LS","LE"].map(k=>`<img src="${IMG[k]}" alt="">`).join("")+`<img class="three" src="${IMG.n3}" alt="">`;
$("#hero").src=IMG.c_happy;$("#zzz").src=IMG.c_sleep;
show();
</script>
